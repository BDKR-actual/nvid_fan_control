[package]
name = "nvid_fan_control"
version = "0.5.0"
edition = "2021"
description = "NVIDIA GPU fan control"
homepage= "https://github.com/BDKR-actual/nvid_fan_control"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arraytools = "0.1.5"
config = "0.14.1"
dirs = "2.0"
envmnt = "0.6.0"
rand = "0.6"
scan_dir = "0.3.3"
epoch-timestamp = "1.0.0"
system = "0.3.3"
anyhow = "1.0.98"
nvml-wrapper = "0.12.1" 
filesize = "0.2.0"

# prettyplease = "0.2"
# antidote = "1.0.0"
# winnow = "1.0.4"
# inotify = "0.11"
# libc = "0.2.159"
# memory-stats = "1.2.0"
# getopts = "0.2.18"
# struct_iterable = "0.1.1"
# charts-rs = "0.3.19"

[profile.dev]
debug = true

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 8
panic = 'unwind'
incremental = false
overflow-checks = false

[build]
rustflags = ["-Z", "threads=12"]
